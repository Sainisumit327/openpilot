name: Build Sunnypilot Sim Release

on:
  push:
    branches:
      - sumit   # run only when you push to your custom branch
  workflow_dispatch:  # allows manual run from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Compile Python files
      run: |
        python -m compileall selfdrive

    - name: Create tarball
      run: |
        git archive --format=tar.gz -o sunnypilot-sumit.tar.gz HEAD

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: sunnypilot-sumit
        path: sunnypilot-sumit.tar.gz
