name: Build Sim Release

on:
  push:
    branches: [ master ]   # use your branch name here
  workflow_dispatch:      # lets you run it manually too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Apply patch
      run: |
        git apply .github/patches/fix.patch || echo "Patch already applied"
